blueprint:
  name: Sécurité - Actions une fois l'alarme déclenchée
  description: Gère les actions via une notification et un script externe
  domain: automation
  input:
    alarm_panel:
      name: Panel d'alarme
      selector:
        entity:
          domain: alarm_control_panel

    monitored_sensors:
      name: Capteurs à surveiller
      selector:
        entity:
          multiple: true

    notify_targets:
      name: Personnes à notifier
      selector:
        entity:
          domain: person
          multiple: true

    alert_title:
      name: Titre de la notification

    alert_script_local:
      name: Script d'alerte locale
      selector:
        entity:
          domain: script

mode: single

variables:
  monitored_entities: !input monitored_sensors
  alert_script_entity: !input alert_script_local

triggers:
  - trigger: state
    entity_id: !input alarm_panel
    to: triggered

actions:
  - parallel:
      - action: notification_engine.create_event
        metadata: {}
        target:
          entity_id: !input notify_targets
        data:
          strategy: alert
          key: >-
            alarme_{{ trigger.entity_id.split('.')[-1] }}
          title: !input alert_title
          message: >-
            {% set entities = expand(monitored_entities) %}
            {% set active = entities | selectattr('state', 'eq', 'on') | list %}
            {% if active | length > 0 %}
              Capteur(s) déclenché(s) : {{ active | map(attribute='name') | join(', ') }}
            {% else %}
              Alarme déclenchée, mais aucun capteur actif trouvé.
            {% endif %}
          actions:
            - action: DONE
              title: OK

      - action: script.turn_on
        target:
          entity_id: "{{ alert_script_entity }}"
