blueprint:
  name: Veilleuse
  description: Allume la lumière quand un mouvement est detecté la nuit.
  domain: automation
  author: Yoan
  input:
    motion_entity:
      name: Capteur de mouvements
      selector:
        entity:
          filter:
            - device_class: occupancy
              domain: binary_sensor
            - device_class: motion
              domain: binary_sensor
    light:
      name: Lumière
      selector:
        entity:
          filter:
            - domain: light
    no_motion_wait:
      name: Temps d'attente
      default: 10
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    brightness:
      name: Luminosité
      default: 1
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

mode: restart
max_exceeded: silent

variables:
  brightness_pct: !input brightness
  light_entity: !input light

triggers:
  - alias: Mouvement détecté
    trigger: state
    entity_id: !input motion_entity
    from: "off"
    to: "on"
    id: motion_on

  - alias: Plus de mouvement pendant le temps d'attente
    trigger: state
    entity_id: !input motion_entity
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off

actions:
  - alias: Gérer la veilleuse
    choose:
      - alias: Allumer la nuit si la lumière est éteinte
        conditions:
          - condition: trigger
            id: motion_on
          - condition: sun
            before: sunrise
            after: sunset
          - condition: state
            entity_id: !input light
            state: "off"
        sequence:
          - alias: Allumer la veilleuse
            action: light.turn_on
            target:
              entity_id: !input light
            data:
              color_temp_kelvin: 2000
              brightness_pct: !input brightness

      - alias: Éteindre si la lumière est encore à la luminosité de veilleuse
        conditions:
          - condition: trigger
            id: motion_off
          - condition: template
            value_template: >-
              {{ (state_attr(light_entity, 'brightness') | float(0))
                 <= (brightness_pct | float(1) * 255 / 100) + 2 }}
        sequence:
          - alias: Éteindre la veilleuse
            action: light.turn_off
            target:
              entity_id: !input light
